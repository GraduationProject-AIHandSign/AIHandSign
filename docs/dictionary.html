<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>수어 사전 | AI 수어 학습 플랫폼</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3eee5;
      --sidebar-bg: #e6e3f1;
      --accent: #6a5cd6;
      --accent-hover: #5648c0;
      --text-dark: #1a1a2e;
      --text-mid: #3d3d5c;
      --text-muted: #7b7b9a;
      --text-on-soft: #4a4060;
      --border: #e0dff0;
      --card-cream: #f9f6f0;
      --card-soft: #ede9f8;
      --card-yellow:  #fdedb0;
      --card-mint:    #c9e6d4;
      --card-peach:   #fad6c0;
      --card-lavender:#d9d1ee;
      --card-pink:    #fcd4d8;
      --card-coral:   #f4b8a3;
      --shadow-card: 0 2px 12px rgba(40,30,80,0.07);
      --shadow-hover: 0 6px 24px rgba(40,30,80,0.14);
      --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-xl: 24px;
      --transition-plain: box-shadow 0.2s ease, border-color 0.2s ease;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; font-family: "Noto Sans KR", sans-serif;
      background: var(--bg); color: var(--text-dark); -webkit-font-smoothing: antialiased;
    }

    /* ── 앱 셸 ── */
    .app-shell { display: flex; height: 100vh; overflow: hidden; }

    /* ── 사이드바 ── */
    .sidebar {
      background: var(--sidebar-bg); border-radius: var(--r-lg);
      padding: 22px 18px; display: flex; flex-direction: column; gap: 14px;
      width: 260px; height: 100%; flex-shrink: 0; overflow-y: auto;
    }
    .brand-block { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
    .brand-mark {
      width: 38px; height: 38px; background: var(--text-dark); border-radius: 11px;
      display: flex; align-items: center; justify-content: center; color: white; flex-shrink: 0;
    }
    .brand-name { font-size: 16px; font-weight: 900; color: var(--text-dark); letter-spacing: -0.02em; line-height: 1.2; }
    .brand-sub { font-size: 11px; color: var(--text-muted); font-weight: 600; margin-top: 1px; }
    .user-block {
      background: white; border-radius: var(--r-md); padding: 12px 14px;
      display: flex; align-items: center; gap: 10px;
    }
    .user-avatar {
      width: 34px; height: 34px; background: var(--sidebar-bg); border-radius: 10px;
      display: flex; align-items: center; justify-content: center; color: var(--text-mid); flex-shrink: 0;
    }
    .user-greeting-line { font-size: 11px; color: var(--text-muted); font-weight: 600; }
    .user-name-line { font-size: 14px; font-weight: 800; color: var(--text-dark); letter-spacing: -0.01em; line-height: 1.3; }
    .side-nav { display: flex; flex-direction: column; gap: 1px; margin-top: 2px; }
    .nav-item {
      display: flex; align-items: center; gap: 11px; padding: 8px 12px;
      border-radius: 10px; font-size: 13px; font-weight: 600;
      color: var(--text-mid); text-decoration: none; transition: var(--transition-plain);
    }
    .nav-item:hover { background: rgba(255,255,255,0.55); color: var(--text-dark); }
    .nav-item.active { background: var(--text-dark); color: white; font-weight: 700; }
    .nav-item svg { flex-shrink: 0; }
    .promo-card {
      background: linear-gradient(135deg, #fad6c0, #f4b8a3);
      border-radius: var(--r-md); padding: 16px 16px 14px; margin-top: auto;
      position: relative; overflow: hidden; text-decoration: none; color: var(--text-dark); display: block;
    }
    .promo-card::before {
      content: ''; position: absolute; right: -20px; bottom: -20px;
      width: 100px; height: 100px;
      background-image: radial-gradient(circle, rgba(255,255,255,0.35) 1.2px, transparent 1.2px);
      background-size: 12px 12px; border-radius: 50%; pointer-events: none;
    }
    .promo-label { font-size: 10px; font-weight: 800; color: rgba(40,30,20,0.55); letter-spacing: 0.08em; text-transform: uppercase; }
    .promo-rank { font-size: 15px; font-weight: 900; color: var(--text-dark); margin-top: 4px; letter-spacing: -0.02em; position: relative; z-index: 1; }
    .promo-cta { margin-top: 10px; font-size: 11px; font-weight: 700; color: var(--text-dark); position: relative; z-index: 1; }
    .promo-progress-track { height: 6px; background: rgba(255,255,255,0.45); border-radius: 99px; overflow: hidden; margin-top: 10px; position: relative; z-index: 1; }
    .promo-progress-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.6s ease; width: 0%; }
    .promo-progress-next { font-size: 10px; font-weight: 700; color: rgba(40,30,20,0.6); margin-top: 5px; position: relative; z-index: 1; }

    /* ── 메인 영역 ── */
    .dict-main {
      flex: 1; overflow-y: auto; padding: 28px 28px 48px;
      display: flex; flex-direction: column; gap: 20px;
    }
    .dict-main::-webkit-scrollbar { width: 5px; }
    .dict-main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }

    /* ── 히어로 (검색) 카드 ── */
    .dict-hero {
      background: var(--card-soft); border-radius: var(--r-xl);
      padding: 32px 36px; position: relative; overflow: hidden;
      flex-shrink: 0;
    }
    .dict-hero::before {
      content: ''; position: absolute; right: -40px; bottom: -40px;
      width: 200px; height: 200px;
      background-image: radial-gradient(circle, rgba(106,92,214,0.18) 1.4px, transparent 1.4px);
      background-size: 14px 14px; border-radius: 50%; pointer-events: none;
    }
    .dict-hero-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.75); color: var(--text-dark);
      border-radius: 100px; padding: 6px 14px;
      font-size: 12px; font-weight: 800; margin-bottom: 14px; letter-spacing: 0.02em;
    }
    .dict-title { font-size: 28px; font-weight: 900; letter-spacing: -0.03em; color: var(--text-dark); margin-bottom: 6px; line-height: 1.2; }
    .dict-desc { font-size: 14px; font-weight: 500; color: var(--text-on-soft); margin-bottom: 20px; line-height: 1.6; }

    /* ── 검색 바 ── */
    .search-wrap { display: flex; gap: 10px; max-width: 600px; }
    .search-wrap input {
      flex: 1; padding: 13px 20px; font-size: 15px;
      border: 2px solid var(--border); border-radius: var(--r-md);
      outline: none; transition: border-color 0.2s; font-family: inherit;
      background: white; color: var(--text-dark);
    }
    .search-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(106,92,214,0.12); }
    .search-wrap input::placeholder { color: var(--text-muted); }
    .search-wrap button {
      padding: 0 24px; font-size: 14px; font-weight: 800;
      background: var(--accent); color: white; border: none;
      border-radius: var(--r-md); cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s; font-family: inherit; white-space: nowrap;
    }
    .search-wrap button:hover { background: var(--accent-hover); box-shadow: 0 4px 14px rgba(106,92,214,0.3); }

    /* ── 카테고리 필터 ── */
    .category-filter { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; position: relative; z-index: 1; }
    .cat-btn {
      padding: 7px 16px; border: 1.5px solid var(--border); border-radius: 100px;
      background: rgba(255,255,255,0.75); color: var(--text-on-soft);
      font-size: 13px; font-weight: 700; cursor: pointer;
      transition: border-color 0.15s, background 0.15s, color 0.15s; font-family: inherit;
    }
    .cat-btn:hover { border-color: var(--accent); color: var(--accent); background: white; }
    .cat-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

    /* ── 단어 카드 그리드 ── */
    .results-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; }
    .result-card {
      background: white;
      border: 1px solid var(--border); border-left: 3px solid var(--border);
      border-radius: var(--r-md);
      padding: 26px; cursor: pointer; transition: var(--transition-plain);
      text-align: left; box-shadow: var(--shadow-card);
    }
    .result-card:hover { box-shadow: var(--shadow-hover); }
    /* 카테고리별 왼쪽 컬러 포인트 */
    .result-card.cat-yellow   { border-left-color: var(--card-yellow); }
    .result-card.cat-yellow:hover   { border-left-color: #d4be50; box-shadow: 0 6px 20px rgba(200,170,30,0.14); }
    .result-card.cat-mint     { border-left-color: var(--card-mint); }
    .result-card.cat-mint:hover     { border-left-color: #7ec8a8; box-shadow: 0 6px 20px rgba(60,180,140,0.14); }
    .result-card.cat-peach    { border-left-color: var(--card-peach); }
    .result-card.cat-peach:hover    { border-left-color: #e8a870; box-shadow: 0 6px 20px rgba(220,130,70,0.14); }
    .result-card.cat-lavender { border-left-color: var(--card-lavender); }
    .result-card.cat-lavender:hover { border-left-color: #a890d8; box-shadow: 0 6px 20px rgba(130,100,210,0.14); }
    .result-card.cat-coral    { border-left-color: var(--card-coral); }
    .result-card.cat-coral:hover    { border-left-color: #d07848; box-shadow: 0 6px 20px rgba(210,100,60,0.14); }
    .result-card.cat-pink     { border-left-color: var(--card-pink); }
    .result-card.cat-pink:hover     { border-left-color: #e890a0; box-shadow: 0 6px 20px rgba(220,80,120,0.14); }
    .result-word { font-size: 22px; font-weight: 900; color: var(--text-dark); margin-bottom: 6px; letter-spacing: -0.02em; }
    .result-desc { font-size: 13px; color: var(--text-muted); line-height: 1.5; }
    .no-result { text-align: center; padding: 40px; color: var(--text-muted); font-size: 16px; font-weight: 600; grid-column: 1 / -1; }

    /* 오버레이 팝업 */
    .word-viewer { display: none; position: fixed; inset: 0; z-index: 200; background: #06080e; flex-direction: column; }
    .word-viewer.open { display: flex; }
    .wv-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: rgba(255,255,255,0.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .wv-back { background: white; border: 1px solid var(--border); color: var(--text-mid); border-radius: 100px; padding: 8px 14px; cursor: pointer; font-size: 13px; font-weight: 700; font-family: inherit; transition: 0.15s; }
    .wv-back:hover { background: var(--bg); border-color: var(--text-dark); color: var(--text-dark); }
    .wv-title { font-size: 15px; font-weight: 800; color: var(--text-dark); }
    .wv-stage { flex: 1; position: relative; overflow: hidden; min-height: 0; }
    .wv-stage canvas { display: block; width: 100% !important; height: 100% !important; }
    .wv-loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: rgba(255,255,255,0.5); font-size: 13px; }
    .wv-spinner { width: 36px; height: 36px; border: 2px solid rgba(255,255,255,0.12); border-top-color: rgba(255,255,255,0.75); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .wv-controls { position: absolute; bottom: 0; left: 0; right: 0; padding: 10px 16px 14px; background: linear-gradient(to top, rgba(6,8,14,0.92), transparent); display: flex; align-items: center; gap: 8px; }
    .wv-av-btn { width: 34px; height: 34px; border-radius: 10px; border: none; background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.9); font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.15s; }
    .wv-av-btn:hover { background: rgba(255,255,255,0.25); }
    .wv-av-btn.is-playing { background: var(--text-dark); color: #fff; }
    .wv-av-progress { flex: 1; height: 4px; background: rgba(255,255,255,0.12); border-radius: 4px; overflow: hidden; }
    .wv-av-bar { height: 100%; background: rgba(255,255,255,0.8); width: 0%; }
    .wv-av-frame { font-size: 10px; color: rgba(255,255,255,0.5); font-family: monospace; min-width: 40px; text-align: right; }
    .wv-speed-wrap { display: flex; align-items: center; gap: 8px; flex-shrink: 0; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; padding: 4px 10px; }
    .wv-speed-label { font-size: 10px; color: rgba(255,255,255,0.5); font-family: monospace; white-space: nowrap; }
    .wv-speed-btns { display: flex; gap: 4px; }
    .wv-spd-btn { padding: 4px 9px; border-radius: 7px; border: 1px solid rgba(255,255,255,0.1); background: transparent; color: rgba(255,255,255,0.55); font-size: 10px; font-weight: 600; cursor: pointer; transition: 0.15s; white-space: nowrap; font-family: inherit; }
    .wv-spd-btn:hover { border-color: rgba(255,255,255,0.4); color: white; }
    .wv-spd-btn.active { background: var(--text-dark); border-color: var(--text-dark); color: #fff; }
    .wv-shortcut-hint { font-size: 10px; color: rgba(255,255,255,0.4); font-family: monospace; white-space: nowrap; flex-shrink: 0; }
    .wv-footer { flex-shrink: 0; background: rgba(255,255,255,0.95); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--border); padding: 18px 24px 20px; display: flex; flex-direction: column; gap: 14px; }
    .wv-footer-top { display: flex; align-items: flex-start; gap: 16px; }
    .wv-word-info { flex: 1; min-width: 0; }
    .wv-word-label { font-size: 12px; color: var(--text-muted); font-weight: 700; font-family: monospace; margin-bottom: 4px; }
    .wv-word-name { font-size: 32px; font-weight: 900; color: var(--text-dark); line-height: 1.15; }
    .wv-desc-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .wv-desc-box { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
    .wv-desc-title { font-size: 11px; font-weight: 700; font-family: monospace; letter-spacing: 0.06em; margin-bottom: 7px; }
    .wv-desc-title.meaning { color: var(--text-mid); }
    .wv-desc-title.how { color: var(--text-mid); }
    .wv-desc-text { font-size: 13px; color: var(--text-mid); line-height: 1.75; }
    .wv-desc-text.skeleton { color: transparent; background: var(--border); border-radius: 6px; height: 52px; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    @media (max-width: 640px) { .wv-desc-wrap { grid-template-columns: 1fr; } .wv-word-name { font-size: 26px; } }
  </style>
</head>

function generateSignDescription(wordName, frames){
  if(!frames || frames.length < 2) return '수어 동작 데이터를 분석할 수 없습니다.';
  const sample = Math.min(frames.length, 24);
  const step = Math.floor(frames.length / sample);
  const samp = Array.from({length: sample}, (_, i) => frames[i * step]);
  const center = hand => {
    if(!hand || hand.length < 5) return null;
    const v = hand.filter(p => p && (p[0]||p[1]));
    if(!v.length) return null;
    return { x: v.reduce((s,p)=>s+p[0],0)/v.length, y: v.reduce((s,p)=>s+p[1],0)/v.length };
  };
  const spread = hand => {
    if(!hand || hand.length < 21) return 0;
    const w = hand[0];
    return [4,8,12,16,20].map(i => hand[i] ? Math.hypot(hand[i][0]-w[0], hand[i][1]-w[1]) : 0).reduce((a,b)=>a+b,0) / 5;
  };
  const lCs = samp.map(f=>center(f.left_hand)).filter(Boolean);
  const rCs = samp.map(f=>center(f.right_hand)).filter(Boolean);
  const lSp = samp.map(f=>spread(f.left_hand));
  const rSp = samp.map(f=>spread(f.right_hand));
  const useL = lCs.length > sample * 0.35;
  const useR = rCs.length > sample * 0.35;
  const avgSp = arr => { const v = arr.filter(x=>x>0); return v.length ? v.reduce((a,b)=>a+b,0)/v.length : 0; };
  const motion = cs => {
    if(cs.length < 4) return null;
    const h = Math.floor(cs.length/2);
    const avg = a => ({ x: a.reduce((s,c)=>s+c.x,0)/a.length, y: a.reduce((s,c)=>s+c.y,0)/a.length });
    const fa = avg(cs.slice(0,h)), ba = avg(cs.slice(h));
    return { dx: ba.x - fa.x, dy: ba.y - fa.y };
  };
  const amplitude = cs => {
    if(cs.length < 4) return 0;
    const ys = cs.map(c=>c.y);
    return Math.max(...ys) - Math.min(...ys);
  };
  const spreadLabel = v => {
    if(v < 0.06) return '주먹을 쥐고';
    if(v < 0.10) return '손가락을 가볍게 구부려';
    if(v < 0.15) return '손가락을 모아 편 채로';
    return '손가락을 활짝 펼쳐';
  };
  const isMoving = (mv, cs) => {
    if(!mv) return false;
    const amp = amplitude(cs);
    return Math.abs(mv.dx) > 0.025 || Math.abs(mv.dy) > 0.025 || amp > 0.04;
  };
  const dirLabel = (mv, cs) => {
    if(!mv) return null;
    const {dx, dy} = mv;
    const amp = amplitude(cs);
    const parts = [];
    if(Math.abs(dy) > 0.025) parts.push(dy < 0 ? '위로' : '아래로');
    if(Math.abs(dx) > 0.025) parts.push(dx < 0 ? '왼쪽으로' : '오른쪽으로');
    if(!parts.length){ if(amp > 0.04) return '상하로 반복해서 흔들며'; return null; }
    return parts.join(' ') + ' 움직이며';
  };
  const lM = motion(lCs), rM = motion(rCs);
  const lMoving = isMoving(lM, lCs);
  const rMoving = isMoving(rM, rCs);
  const parts = [];
  if(useR && useL){
    const ls = avgSp(lSp), rs = avgSp(rSp);
    if(rMoving && lMoving){
      const symSp = Math.abs(ls - rs) < 0.04;
      if(symSp){ parts.push(`양손을 ${spreadLabel(rs)}`); const rDir = dirLabel(rM, rCs); if(rDir) parts.push(rDir); }
      else { const rDir = dirLabel(rM, rCs); const lDir = dirLabel(lM, lCs); if(rDir) parts.push(`오른손을 ${spreadLabel(rs)} ${rDir}`); if(lDir) parts.push(`왼손을 ${spreadLabel(ls)} ${lDir}`); }
    } else if(rMoving){ parts.push(`오른손을 ${spreadLabel(rs)}`); const rDir = dirLabel(rM, rCs); if(rDir) parts.push(rDir); }
    else if(lMoving){ parts.push(`왼손을 ${spreadLabel(ls)}`); const lDir = dirLabel(lM, lCs); if(lDir) parts.push(lDir); }
    else { const symSp = Math.abs(ls - rs) < 0.04; if(symSp) parts.push(`양손을 ${spreadLabel(rs)} 고정된 자세로`); else parts.push(`오른손은 ${spreadLabel(rs)}, 왼손은 ${spreadLabel(ls)} 고정된 자세로`); }
    parts.push('수어를 표현합니다.');
  } else if(useR){
    parts.push(`오른손을 ${spreadLabel(avgSp(rSp))}`);
    const rDir = dirLabel(rM, rCs); if(rDir) parts.push(rDir);
    parts.push('수어를 표현합니다.');
  } else if(useL){
    parts.push(`왼손을 ${spreadLabel(avgSp(lSp))}`);
    const lDir = dirLabel(lM, lCs); if(lDir) parts.push(lDir);
    parts.push('수어를 표현합니다.');
  } else {
    return '손 동작 정보를 분석하기 어렵습니다.';
  }
  return parts.join(' ');
}


function fetchWordDescription(wordName, wordId, frames){
  const cacheKey = wordId || wordName;
  if(descCache[cacheKey]){
    wvDescHow.textContent = descCache[cacheKey];
    wvDescHow.classList.remove('skeleton');
    return;
  }
  const how = generateSignDescription(wordName, frames);
  descCache[cacheKey] = how;
  wvDescHow.textContent = how;
  wvDescHow.classList.remove('skeleton');
}

function getCatClass(category) {
  if (!category || category === 'null') return '';
  const c = category;
  if (['감정','성격','심리','태도','행동','표현','동작','인격'].some(k => c.includes(k)))                     return 'cat-yellow';
  if (['건강','의료','병원','약'].some(k => c.includes(k)))                                                   return 'cat-mint';
  if (['사람','인물','가족','인사','신체'].some(k => c.includes(k)))                                          return 'cat-peach';
  if (['스포츠','운동','취미','문화','예술','음악','영화','게임','여행','놀이'].some(k => c.includes(k)))     return 'cat-lavender';
  if (['음식','요리','식품','식재료','식사','간식','음료'].some(k => c.includes(k)))                          return 'cat-coral';
  if (['일상','생활','집','주거','의복','옷','날씨','계절','시간','물건'].some(k => c.includes(k)))           return 'cat-pink';
  return '';
}

function renderCards(words) {
  resultsGrid.innerHTML = '';
  if (!words.length) {
    resultsGrid.innerHTML = '<div class="no-result">검색 결과가 없습니다.</div>';
    return;
  }
  words.forEach(item => {
    const desc = item.category && item.category !== 'null' ? item.category : '';
    const card = document.createElement('div');
    const catCls = getCatClass(item.category);
    card.className = 'result-card' + (catCls ? ' ' + catCls : '');
    card.innerHTML = `
      <div class="result-word">${item.word_name}</div>
      <div class="result-desc">${desc}</div>
    `;
    card.addEventListener('click', () => openDictionaryViewer(item));
    resultsGrid.appendChild(card);
  });
}

// 대분류 그룹 정의 — loadWords와 initCategories가 공유
const CATEGORY_GROUPS = [
  { label: '일상 · 생활',   match: ['일상', '생활', '가족', '사람', '인사', '신체', '집', '주거', '의복', '옷', '날씨', '계절', '시간', '물건'] },
  { label: '감정 · 행동',   match: ['감정', '성격', '심리', '태도', '행동', '표현', '동작', '인격'] },
  { label: '음식 · 건강',   match: ['음식', '요리', '식품', '식재료', '건강', '의료', '병원', '약', '음료', '식사', '간식'] },
  { label: '교육 · 직업',   match: ['학교', '교육', '공부', '직업', '직장', '업무', '경제', '금융', '돈', '수업', '학습'] },
  { label: '사회 · 공공',   match: ['사회', '정치', '법', '군대', '경찰', '소방', '공공', '정부', '국가', '나라', '행정'] },
  { label: '자연 · 동식물', match: ['자연', '동물', '식물', '환경', '지형', '바다', '산', '강', '꽃', '나무', '생물'] },
  { label: '스포츠 · 문화', match: ['스포츠', '운동', '취미', '여가', '문화', '예술', '음악', '영화', '게임', '여행', '놀이'] },
  { label: '교통 · 장소',   match: ['교통', '장소', '지역', '건물', '도시', '지하철', '버스', '자동차', '비행기', '위치'] },
];

// 세부 카테고리 → 대분류 매핑
function assignGroup(cat) {
  if (!cat) return '기타';
  for (const g of CATEGORY_GROUPS) {
    if (g.match.some(k => cat === k || cat.includes(k) || k.includes(cat))) return g.label;
  }
  return '기타';
}

// 대분류 버튼 클릭 시 캐시에서 클라이언트 필터링
function loadWords(groupLabel) {
  document.querySelectorAll('.cat-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.cat === groupLabel);
  });
  if (!groupLabel) { renderCards(allWordsCache); return; }
  renderCards(allWordsCache.filter(w => assignGroup(w.category) === groupLabel));
}

async function initCategories() {
  resultsGrid.innerHTML = '<div class="no-result">단어 데이터 불러오는 중...</div>';
  try {
    const res = await fetch(`${API_BASE}/words/?limit=3000`, { headers: NGROK_HEADERS });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    allWordsCache = await res.json();
    renderCards(allWordsCache);
  } catch (e) {
    console.error('[initCategories]', e);
    resultsGrid.innerHTML = '<div class="no-result">⚠ 데이터를 불러올 수 없습니다. 서버를 확인하세요.</div>';
  }
}

async function doSearch() {
  const query = document.getElementById('searchInput').value.trim();
  if (!query) { loadWords(''); return; }

  // 검색 시 카테고리 버튼 active 해제
  document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));

  resultsGrid.innerHTML = '<div class="no-result">검색 중...</div>';
  try {
    const res = await fetch(`${API_BASE}/words/search/${encodeURIComponent(query)}`, {
      headers: NGROK_HEADERS
    });
    if (!res.ok) throw new Error('Search failed');
    const matched = await res.json();

    if (!matched.length) {
      resultsGrid.innerHTML = `<div class="no-result">'${query}'에 대한 검색 결과가 없습니다.</div>`;
      return;
    }

    // 정확도 우선순위 정렬
    matched.sort((a, b) => {
      const score = name => {
        if (name === query) return 0;
        if (name.startsWith(query)) return 1;
        if (name.includes(query)) return 2;
        return 3;
      };
      const sa = score(a.word_name), sb = score(b.word_name);
      if (sa !== sb) return sa - sb;
      return a.word_name.length - b.word_name.length || a.word_name.localeCompare(b.word_name, 'ko');
    });

    renderCards(matched);
  } catch (e) {
    resultsGrid.innerHTML = '<div class="no-result">⚠ 검색 중 오류가 발생했습니다. 서버를 확인하세요.</div>';
  }
}

document.getElementById('searchBtn').addEventListener('click', doSearch);
document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

document.getElementById('categoryFilter').addEventListener('click', e => {
  const btn = e.target.closest('.cat-btn');
  if (!btn) return;
  document.getElementById('searchInput').value = '';
  loadWords(btn.dataset.cat);
});

// 초기 로딩: 전체 단어를 한 번 가져와 카테고리 버튼 동적 생성
initCategories();

// URL 파라미터 자동 실행 (오답 노트 → 사전 직행 시 즉시 아바타 재생)
(async function autoOpenFromQuery() {
  const params = new URLSearchParams(window.location.search);
  const wid = params.get('word_id');
  if (!wid) return;
  try {
    const res = await fetch(`${API_BASE}/words/${wid}`, { headers: NGROK_HEADERS });
    if (!res.ok) return;
    const detail = await res.json();
    if (detail && detail.word_id) openDictionaryViewer(detail);
  } catch (e) {
    console.error('[autoOpenFromQuery]', e);
  }
})();

async function openDictionaryViewer(item) {
  wvViewer.classList.add('open');
  wvWordName.textContent = item.word_name;

  wvDescMeaning.textContent = item.category && item.category !== 'null'
    ? item.category
    : `한국 수어에서 '${item.word_name}'을(를) 나타내는 표현입니다.`;
  wvDescHow.textContent = '';
  wvDescHow.classList.add('skeleton');

  // 단어 상세 정보 비동기 요청 (GCS 로딩과 병렬 실행, 이미 description 있으면 스킵)
  if (item.description) {
    wvDescMeaning.textContent = item.description;
  } else if (item.word_id) {
    fetch(`${API_BASE}/words/${item.word_id}`, { headers: NGROK_HEADERS })
      .then(r => r.ok ? r.json() : null)
      .then(detail => {
        if (detail && detail.description) wvDescMeaning.textContent = detail.description;
        if (detail && detail.category && detail.category !== 'null' && !(detail.description))
          wvDescMeaning.textContent = detail.category;
      })
      .catch(() => {});
  }

  wvLoading.style.display = 'flex';
  wvLoading.innerHTML = '<div class="wv-spinner"></div><span>수어 데이터 불러오는 중...</span>';

  if (wvPlayer) { wvPlayer.destroy(); wvPlayer = null; }

  // gcs_path 우선, 없으면 word_id로 파일명 조합
  const gcsUrl = item.gcs_path
    ? `${GCS_BASE_URL}/${item.gcs_path}`
    : item.word_id
      ? `${GCS_BASE_URL}/WORD${String(item.word_id).padStart(4, '0')}.json`
      : null;

  if (!gcsUrl) {
    wvLoading.innerHTML = '<span style="color:#f55c8a">⚠ 이 단어에 대한 모션 데이터가 없습니다.</span>';
    wvDescHow.classList.remove('skeleton');
    wvDescHow.textContent = '모션 데이터가 없어 동작을 분석할 수 없습니다.';
    return;
  }

  try {
    const res = await fetch(gcsUrl);
    if (!res.ok) throw new Error('Data load failed');
    const data = await res.json();

    wvLoading.style.display = 'none';
    wvPlayer = new AvatarPlayer(wvCanvas, wvBar, wvPlayBtn, wvFrame);
    wvPlayer.setSpeed(currentSpeed);
    wvPlayer.load(data);

    fetchWordDescription(item.word_name, item.word_id, data.frames);
  } catch (e) {
    wvLoading.innerHTML = '<span style="color:#f55c8a">⚠ 데이터를 불러올 수 없습니다. 네트워크를 확인하세요.</span>';
    wvDescHow.classList.remove('skeleton');
    wvDescHow.textContent = '데이터 로드 실패로 동작을 분석할 수 없습니다.';
  }
}

const wvSpeedBtns = document.getElementById('wvSpeedBtns');
const SPEED_STEPS = [2, 4, 6, 10, 16];
let currentSpeed = 6;

function applySpeed(step) {
  currentSpeed = SPEED_STEPS[step - 1];
  wvSpeedBtns.querySelectorAll('.wv-spd-btn').forEach(btn => {
    btn.classList.toggle('active', Number(btn.dataset.step) === step);
  });
  if (wvPlayer) wvPlayer.setSpeed(currentSpeed);
}

wvSpeedBtns.addEventListener('click', e => {
  const btn = e.target.closest('.wv-spd-btn');
  if (btn) applySpeed(Number(btn.dataset.step));
});

wvBack.addEventListener('click', () => {
  wvViewer.classList.remove('open');
  if(wvPlayer) { wvPlayer.destroy(); wvPlayer = null; }
});
wvPlayBtn.addEventListener('click', () => { if(wvPlayer) wvPlayer.toggle(); });
wvReplayBtn.addEventListener('click', () => { if(wvPlayer) wvPlayer.replay(); });

document.addEventListener('keydown', e => {
  if (!wvViewer.classList.contains('open') || !wvPlayer) return;
  if(e.code === 'Space') { e.preventDefault(); wvPlayer.toggle(); }
  if(e.key === 'r' || e.key === 'R') { wvPlayer.replay(); }
  if(e.key === 'Escape') { wvBack.click(); }
});

// ── 사이드바 위젯 (홈페이지와 동일 로직) ──
const RANKS = [
  { emoji: '🌱', name: '수어 입문자', minTotal: 0,  minAcc: 0   },
  { emoji: '🥉', name: '수어 도전자', minTotal: 5,  minAcc: 40  },
  { emoji: '🥈', name: '수어 학습자', minTotal: 10, minAcc: 60  },
  { emoji: '🥇', name: '수어 마스터', minTotal: 15, minAcc: 80  },
  { emoji: '💎', name: '수어 챔피언', minTotal: 20, minAcc: 95  },
  { emoji: '👑', name: '수어 천재',   minTotal: 20, minAcc: 100 },
];

function _getUserRank() {
  const qs = JSON.parse(localStorage.getItem('quiz_stats') || '{"correct":0,"total":0}');
  const total = qs.total || 0;
  const accuracy = total > 0 ? Math.round(qs.correct / qs.total * 100) : 0;
  if (total >= 20 && accuracy === 100) return { emoji: '👑', name: '수어 천재' };
  if (total >= 20 && accuracy >= 95)  return { emoji: '💎', name: '수어 챔피언' };
  if (total >= 15 && accuracy >= 80)  return { emoji: '🥇', name: '수어 마스터' };
  if (total >= 10 && accuracy >= 60)  return { emoji: '🥈', name: '수어 학습자' };
  if (total >= 5  && accuracy >= 40)  return { emoji: '🥉', name: '수어 도전자' };
  return { emoji: '🌱', name: '수어 입문자' };
}

function _updateRankChip() {
  const chip = document.getElementById('userRankChip');
  if (!chip) return;
  const rank = _getUserRank();
  chip.textContent = `${rank.emoji} ${rank.name}`;
  _updateRankBanner();
}

function _updateRankBanner() {
  const qs = JSON.parse(localStorage.getItem('quiz_stats') || '{"correct":0,"total":0}');
  const total = qs.total || 0;
  const accuracy = total > 0 ? Math.round(qs.correct / qs.total * 100) : 0;
  let rankIdx = 0;
  for (let i = RANKS.length - 1; i >= 0; i--) {
    if (total >= RANKS[i].minTotal && accuracy >= RANKS[i].minAcc) { rankIdx = i; break; }
  }
  const next = RANKS[rankIdx + 1];
  const fillEl = document.getElementById('promoProgressFill');
  const textEl = document.getElementById('promoProgressNext');
  if (!fillEl) return;
  if (!next) {
    fillEl.style.width = '100%';
    if (textEl) textEl.textContent = '🏆 모든 등급 달성!';
    return;
  }
  const totalPct = next.minTotal > 0 ? Math.min(100, Math.round(total / next.minTotal * 100)) : 100;
  const accPct   = next.minAcc   > 0 ? Math.min(100, Math.round(accuracy / next.minAcc * 100)) : 100;
  fillEl.style.width = Math.min(totalPct, accPct) + '%';
  if (textEl) textEl.textContent = `다음 등급까지 ${100 - Math.min(totalPct, accPct)}% 남았어요`;
}

(function initSidebar() {
  const nameEl = document.getElementById('userName');
  if (nameEl) nameEl.textContent = localStorage.getItem('user_name') || '친구';
  _updateRankChip();
})();
