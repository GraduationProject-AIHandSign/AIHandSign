  <style>
    :root {
      --bg: #f3eee5;
      --sidebar-bg: #e6e3f1;
      --accent: #6a5cd6;
      --accent-hover: #5648c0;
      --text-dark: #1a1a2e;
      --text-mid: #3d3d5c;
      --text-muted: #7b7b9a;
      --text-on-soft: #4a4060;
      --border: #e0dff0;
      --card-cream: #f9f6f0;
      --card-soft: #ede9f8;
      --shadow-card: 0 2px 12px rgba(40,30,80,0.07);
      --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-xl: 24px;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-plain: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      height: 100vh; overflow: hidden;
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif;
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    /* ── 앱 셸 ── */
    .app-shell { display: flex; height: 100vh; overflow: hidden; }

    /* ── 사이드바 ── */
    .sidebar {
      background: var(--sidebar-bg); border-radius: var(--r-lg);
      padding: 22px 18px; display: flex; flex-direction: column; gap: 14px;
      width: 260px; height: 100%; flex-shrink: 0; overflow-y: auto;
    }
    .brand-block { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
    .brand-mark {
      width: 38px; height: 38px; background: var(--text-dark); border-radius: 11px;
      display: flex; align-items: center; justify-content: center; color: white; flex-shrink: 0;
    }
    .brand-name { font-size: 16px; font-weight: 900; color: var(--text-dark); letter-spacing: -0.02em; line-height: 1.2; }
    .brand-sub  { font-size: 11px; color: var(--text-muted); font-weight: 600; margin-top: 1px; }
    .user-block {
      background: white; border-radius: var(--r-md); padding: 12px 14px;
      display: flex; align-items: center; gap: 10px;
    }
    .user-avatar {
      width: 34px; height: 34px; background: var(--sidebar-bg); border-radius: 10px;
      display: flex; align-items: center; justify-content: center; color: var(--text-mid); flex-shrink: 0;
    }
    .user-greeting-line { font-size: 11px; color: var(--text-muted); font-weight: 600; }
    .user-name-line { font-size: 14px; font-weight: 800; color: var(--text-dark); letter-spacing: -0.01em; line-height: 1.3; }
    .side-nav { display: flex; flex-direction: column; gap: 1px; margin-top: 2px; }
    .nav-item {
      display: flex; align-items: center; gap: 11px; padding: 8px 12px;
      border-radius: 10px; font-size: 13px; font-weight: 600;
      color: var(--text-mid); text-decoration: none; transition: var(--transition-plain);
    }
    .nav-item:hover  { background: rgba(255,255,255,0.55); color: var(--text-dark); }
    .nav-item.active { background: var(--text-dark); color: white; font-weight: 700; }
    .nav-item svg { flex-shrink: 0; }
    .promo-card {
      background: linear-gradient(135deg, #fad6c0, #f4b8a3);
      border-radius: var(--r-md); padding: 16px 16px 14px; margin-top: auto;
      position: relative; overflow: hidden; text-decoration: none; color: var(--text-dark); display: block;
    }
    .promo-card::before {
      content: ''; position: absolute; right: -20px; bottom: -20px;
      width: 100px; height: 100px;
      background-image: radial-gradient(circle, rgba(255,255,255,0.35) 1.2px, transparent 1.2px);
      background-size: 12px 12px; border-radius: 50%; pointer-events: none;
    }
    .promo-label { font-size: 10px; font-weight: 800; color: rgba(40,30,20,0.55); letter-spacing: 0.08em; text-transform: uppercase; }
    .promo-rank  { font-size: 15px; font-weight: 900; color: var(--text-dark); margin-top: 4px; letter-spacing: -0.02em; position: relative; z-index: 1; }
    .promo-cta   { margin-top: 10px; font-size: 11px; font-weight: 700; color: var(--text-dark); position: relative; z-index: 1; }
    .promo-progress-track { height: 6px; background: rgba(255,255,255,0.45); border-radius: 99px; overflow: hidden; margin-top: 10px; position: relative; z-index: 1; }
    .promo-progress-fill  { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.6s ease; width: 0%; }
    .promo-progress-next  { font-size: 10px; font-weight: 700; color: rgba(40,30,20,0.6); margin-top: 5px; position: relative; z-index: 1; }

    /* ── 챗봇 메인 ── */
    .chat-main {
      flex: 1; display: flex; flex-direction: column;
      gap: 14px; padding: 14px; overflow: hidden; min-width: 0;
    }

    .chat-header {
      background: var(--card-soft); border-radius: var(--r-xl);
      padding: 20px 28px; display: flex; align-items: center; gap: 16px;
      flex-shrink: 0;
    }
    .chat-header-logo {
      width: 52px; height: 52px; background: var(--text-dark); border-radius: 15px;
      display: flex; align-items: center; justify-content: center; color: white; flex-shrink: 0;
    }
    .chat-header-title { font-size: 22px; font-weight: 900; color: var(--text-dark); letter-spacing: -0.03em; line-height: 1.2; }
    .chat-header-sub   { font-size: 13px; color: var(--text-muted); font-weight: 500; margin-top: 3px; }

    /* ── 채팅 컨테이너 ── */
    .chat-container {
      flex: 1; background: white; border-radius: var(--r-xl);
      box-shadow: var(--shadow-card); display: flex; flex-direction: column; overflow: hidden;
    }

    .chat-messages {
      flex: 1; overflow-y: auto; padding: 28px 24px;
      display: flex; flex-direction: column; gap: 18px; scroll-behavior: smooth;
    }
    .chat-messages::-webkit-scrollbar { width: 5px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

    .message { display: flex; align-items: flex-end; gap: 10px; max-width: 78%; }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.bot  { align-self: flex-start; }

    .avatar {
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; flex-shrink: 0;
    }
    .message.user .avatar {
      background: linear-gradient(135deg, var(--accent), #8b7fe8);
      box-shadow: 0 4px 10px rgba(106,92,214,0.3);
    }
    .message.bot .avatar {
      background: var(--text-dark);
      box-shadow: 0 4px 10px rgba(26,26,46,0.2);
    }

    .bubble {
      padding: 12px 16px; border-radius: 18px;
      font-size: 14.5px; line-height: 1.7; white-space: pre-wrap; word-break: break-word;
    }
    .message.user .bubble {
      background: linear-gradient(135deg, var(--accent), #8b7fe8);
      color: white; border-bottom-right-radius: 4px;
      box-shadow: 0 4px 14px rgba(106,92,214,0.25);
    }
    .message.bot .bubble {
      background: var(--card-cream); color: var(--text-dark);
      border: 1px solid var(--border); border-bottom-left-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .typing .bubble { display: flex; gap: 5px; align-items: center; padding: 14px 20px; }
    .dot { width: 7px; height: 7px; background: var(--text-muted); border-radius: 50%; animation: bounce 1.2s infinite ease-in-out; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

    .chat-input-area {
      padding: 14px 18px; border-top: 1px solid var(--border);
      background: var(--card-cream); display: flex; gap: 10px; align-items: flex-end;
    }

    #userInput {
      flex: 1; border: 1.5px solid var(--border); border-radius: 16px;
      padding: 11px 16px; font-size: 14.5px; font-family: inherit;
      resize: none; outline: none; background: white;
      max-height: 120px; transition: border-color 0.2s, box-shadow 0.2s;
      line-height: 1.6; color: var(--text-dark);
    }
    #userInput:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(106,92,214,0.1);
    }
    #userInput::placeholder { color: var(--text-muted); }

    #sendBtn {
      width: 44px; height: 44px; border-radius: 13px;
      background: var(--accent); border: none; cursor: pointer; color: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; transition: var(--transition); flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(106,92,214,0.3);
    }
    #sendBtn:hover  { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 6px 18px rgba(106,92,214,0.4); }
    #sendBtn:active { transform: scale(0.95); }
    #sendBtn:disabled { background: var(--border); box-shadow: none; cursor: not-allowed; }

    .welcome {
      text-align: center; margin: auto; padding: 24px;
      display: flex; flex-direction: column; align-items: center;
    }
    .welcome-logo {
      width: 88px; height: 88px; background: var(--text-dark); border-radius: 24px;
      display: flex; align-items: center; justify-content: center; color: white;
      margin-bottom: 20px;
    }
    .welcome p { font-size: 15px; line-height: 1.8; color: var(--text-muted); }
  </style>
</head>

  <script>
    // ── 사이드바 위젯 (홈페이지와 동일 로직) ──
    const RANKS = [
      { emoji: '🌱', name: '수어 입문자', minTotal: 0,  minAcc: 0   },
      { emoji: '🥉', name: '수어 도전자', minTotal: 5,  minAcc: 40  },
      { emoji: '🥈', name: '수어 학습자', minTotal: 10, minAcc: 60  },
      { emoji: '🥇', name: '수어 마스터', minTotal: 15, minAcc: 80  },
      { emoji: '💎', name: '수어 챔피언', minTotal: 20, minAcc: 95  },
      { emoji: '👑', name: '수어 천재',   minTotal: 20, minAcc: 100 },
    ];
    function _getUserRank() {
      const qs = JSON.parse(localStorage.getItem('quiz_stats') || '{"correct":0,"total":0}');
      const total = qs.total || 0;
      const accuracy = total > 0 ? Math.round(qs.correct / qs.total * 100) : 0;
      let rank = RANKS[0];
      for (const r of RANKS) { if (total >= r.minTotal && accuracy >= r.minAcc) rank = r; }
      return { rank, total, accuracy };
    }
    function _updateRankBanner() {
      const fillEl = document.getElementById('promoProgressFill');
      const textEl = document.getElementById('promoProgressNext');
      if (!fillEl) return;
      const { rank, total, accuracy } = _getUserRank();
      const idx = RANKS.indexOf(rank);
      if (idx === RANKS.length - 1) {
        fillEl.style.width = '100%';
        if (textEl) textEl.textContent = '🏆 모든 등급 달성!';
        return;
      }
      const next = RANKS[idx + 1];
      const totalPct = next.minTotal > 0 ? Math.min(100, Math.round(total / next.minTotal * 100)) : 100;
      const accPct   = next.minAcc   > 0 ? Math.min(100, Math.round(accuracy / next.minAcc * 100)) : 100;
      fillEl.style.width = Math.min(totalPct, accPct) + '%';
      if (textEl) textEl.textContent = `다음 등급까지 ${100 - Math.min(totalPct, accPct)}% 남았어요`;
    }
    function _updateRankChip() {
      const chip = document.getElementById('userRankChip');
      if (!chip) return;
      const { rank } = _getUserRank();
      chip.textContent = `${rank.emoji} ${rank.name}`;
      _updateRankBanner();
    }
    (function initSidebar() {
      const nameEl = document.getElementById('userName');
      if (nameEl) nameEl.textContent = localStorage.getItem('user_name') || '친구';
      _updateRankChip();
    })();
  </script>

  <script>
    const API_BASE_URL   = "https://antler-bulldog-puppet.ngrok-free.dev";
    const NGROK_HEADERS  = { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" };
    const SYSTEM_FALLBACK = `당신은 AI 수어 학습 플랫폼의 AI 튜터입니다.

[플랫폼 기능]
- 교육: 커리큘럼 순서대로 수어 단어를 영상으로 학습
- 번역: 카메라로 수어를 실시간 인식해 텍스트로 변환
- 퀴즈: 학습한 단어를 퀴즈로 복습하고 점수 기록
- 사전: 단어 검색 후 3D 아바타로 동작 확인
- 오늘의 단어: 매일 5개의 단어가 커리큘럼 순서대로 배정

[역할]
사용자의 학습 현황과 플랫폼 기능을 바탕으로 맞춤 조언을 한국어로 친절하게 제공하세요.
아래 [사용자 학습 현황]이 제공된 경우 반드시 해당 데이터를 기반으로 답변하세요.`;

    const userId = localStorage.getItem("user_id");

    const chatMessages = document.getElementById("chatMessages");
    const userInput    = document.getElementById("userInput");
    const sendBtn      = document.getElementById("sendBtn");

    let history = [];
    let isFirst = true;
    let systemPrompt = SYSTEM_FALLBACK;

    // ── 페이지 로드 시 학습 컨텍스트 미리 로드 ──
    async function loadLearningContext() {
      if (!userId) return;
      try {
        const [statsRes, wrongRes, dailyRes] = await Promise.all([
          fetch(`${API_BASE_URL}/learning/${userId}/stats`, { headers: NGROK_HEADERS }),
          fetch(`${API_BASE_URL}/learning/${userId}/wrong`, { headers: NGROK_HEADERS }),
          fetch(`${API_BASE_URL}/daily/${userId}`, { headers: NGROK_HEADERS }),
        ]);

        const stats = statsRes.ok ? await statsRes.json() : null;
        const wrong = wrongRes.ok ? await wrongRes.json() : [];
        const daily = dailyRes.ok ? await dailyRes.json() : [];

        if (!stats && !daily.length) return;

        const dailySummary = daily.length
          ? daily.map(w => `${w.word_name}(${w.category}, ${w.is_learned ? "학습 완료" : "미학습"})`).join(", ")
          : "없음";
        const wrongSummary = wrong.length
          ? wrong.slice(0, 5).map(w => `${w.word_name}(${w.category})`).join(", ")
          : "없음";

        systemPrompt = `${SYSTEM_FALLBACK}

[사용자 학습 현황]
- 오늘의 단어: ${dailySummary}
- 총 학습 횟수: ${stats?.total_logs ?? 0}회 | 정답률: ${stats?.accuracy ?? 0}% | 학습한 단어 수: ${stats?.learned_words ?? 0}개
- 최근 틀린 단어: ${wrongSummary}`;

        console.log("[챗봇] 학습 컨텍스트 로드 완료");
      } catch (e) {
        console.warn("[챗봇] 학습 컨텍스트 로드 실패:", e.message);
      }
    }

    function addMessage(role, text) {
      if (isFirst) { chatMessages.innerHTML = ""; isFirst = false; }
      const wrap = document.createElement("div");
      wrap.className = `message ${role}`;
      wrap.innerHTML = `
        <div class="avatar">${role === "user" ? "🙋" : "🤖"}</div>
        <div class="bubble">${text}</div>`;
      chatMessages.appendChild(wrap);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return wrap;
    }

    function showTyping() {
      if (isFirst) { chatMessages.innerHTML = ""; isFirst = false; }
      const wrap = document.createElement("div");
      wrap.className = "message bot typing";
      wrap.innerHTML = `
        <div class="avatar">🤖</div>
        <div class="bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
      chatMessages.appendChild(wrap);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return wrap;
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      userInput.value = "";
      userInput.style.height = "auto";
      sendBtn.disabled = true;

      addMessage("user", text);
      const priorHistory = history.slice();
      history.push({ role: "user", text });
      const typingEl = showTyping();

      try {
        // 백엔드 /chat/ 경유 호출 (Gemini 키는 서버에만 존재)
        const chatRes = await fetch(`${API_BASE_URL}/chat/`, {
          method: "POST",
          headers: NGROK_HEADERS,
          body: JSON.stringify({
            user_id: userId ? parseInt(userId) : null,
            message: text,
            system_prompt: systemPrompt,
            history: priorHistory,
          }),
        });
        const chatData = await chatRes.json();
        if (!chatRes.ok) throw new Error(typeof chatData.detail === "string" ? chatData.detail : "챗봇 오류");
        const answer = chatData.answer;

        history.push({ role: "model", text: answer });
        typingEl.remove();
        addMessage("bot", answer
          .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
          .replace(/\*(.+?)\*/g, "<em>$1</em>")
          .replace(/\n/g, "<br>"));


      } catch (e) {
        typingEl.remove();
        addMessage("bot", `⚠️ 오류: ${e.message}`);
      }

      sendBtn.disabled = false;
      userInput.focus();
    }

    loadLearningContext();

    sendBtn.addEventListener("click", sendMessage);
    userInput.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    userInput.addEventListener("input", () => {
      userInput.style.height = "auto";
      userInput.style.height = userInput.scrollHeight + "px";
    });
  </script>
</body>
</html>
